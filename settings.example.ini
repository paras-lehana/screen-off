; Copy to settings.ini, or just use the Settings window (tray icon > Settings...).
; settings.ini is personal and not committed.

[Keys]
; AutoHotkey syntax: ^ = Ctrl, ! = Alt, + = Shift, # = Windows.
OffHotkey=^!F12
; One key name. Press and RELEASE it to wake the screens.
WakeKey=Space

[Security]
; Restore input, display and lighting first; then lock Windows once both are confirmed.
LockOnWake=1

[UI]
; How long the "turning off" notice stays (seconds). It never delays standby.
NoticeSeconds=30

[Lighting]
; Which lighting systems to turn off with the screens (1 = on). Aura and Corsair may run
; together; OpenRGB and DynamicLighting must each run alone.
Aura=0
Corsair=0
; Corsair device types: keyboard, mouse, mousemat, headset, headsetstand, cooler,
; fancontroller, ledcontroller, memory, gamecontroller.
CorsairDevices=keyboard,mouse,mousemat,headset,headsetstand
OpenRGB=0
DynamicLighting=0

[Aura]
; profile = Armoury Crate's own Dark effect via Windows UI Automation (reaches synced RAM);
; sdk = ASUS Aura COM SDK.
Method=profile
; Effect selected on wake: breathing, rainbow, colorcycle, static or dark.
WakeEffect=breathing
; 1 = restore whichever effect was selected before (including Dark).
RestorePrevious=0

[OpenRGB]
; Connects only to an OpenRGB SDK server already running on this PC.
Port=6742
